<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>簡易六法</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="簡易六法">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfaf4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="hd">
  <button id="back" class="ib" aria-label="法令一覧へ"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
  <div id="ttl"><span id="lawname">簡易六法</span><span id="old" hidden>旧版</span><span id="cur"></span></div>
  <button id="btn-set" class="ib txt" aria-label="表示設定">ああ</button>
</header>

<main id="home">
  <input id="filter" type="search" placeholder="法令名で絞り込み" autocomplete="off">
  <div id="lawlist"></div>
  <footer id="foot"></footer>
</main>

<main id="law" hidden><article id="body" class="lawtext"></article></main>

<div id="dock">
<div id="tabs" hidden></div>
<nav id="bar" hidden>
  <button id="nav-back" disabled><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg><span>戻る</span></button>
  <button id="nav-fwd" disabled><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg><span>進む</span></button>
  <button id="nav-toc"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>目次</span></button>
  <button id="nav-find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>検索</span></button>
  <button id="nav-jump"><svg viewBox="0 0 24 24"><path d="M5 19c0-6 4-9 10-9M11 5l5 5-5 5"/></svg><span>条文番号</span></button>
</nav>
</div>

<div id="scrim" hidden></div>

<section id="sheet-jump" class="sheet" hidden>
  <h2>条文番号を入力</h2>
  <div id="jump-input"><span id="jump-val"></span><span id="jump-prev"></span></div>
  <div id="jump-hist"></div>
  <div id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button id="pad-del" aria-label="1文字消す"><svg viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7zM12 9.5l5 5M17 9.5l-5 5"/></svg></button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button id="pad-go">ジャンプ</button>
    <button data-k="の" class="no">の</button><button data-k="0">0</button><span></span>
  </div>
</section>

<section id="sheet-toc" class="sheet tall" hidden>
  <h2>目次</h2>
  <div id="toc" class="scroll"></div>
</section>

<section id="sheet-find" class="sheet tall" hidden>
  <h2>この法令を検索</h2>
  <input id="find-q" type="search" placeholder="語句を入力" autocomplete="off" enterkeyhint="search">
  <div id="find-res" class="scroll"></div>
</section>

<section id="sheet-set" class="sheet" hidden>
  <h2>表示設定</h2>
  <div class="row"><span>文字サイズ</span>
    <span class="seg"><button id="fs-dn">小</button><b id="fs-val"></b><button id="fs-up">大</button></span></div>
  <div class="row"><span>書体</span>
    <span class="seg"><button data-font="gothic">ゴシック</button><button data-font="mincho">明朝</button></span></div>
  <div class="row"><span>括弧書きを薄くする</span>
    <span class="seg"><button data-dim="0">しない</button><button data-dim="1">する</button></span></div>
</section>

<section id="sheet-ver" class="sheet" hidden>
  <h2>版を選ぶ</h2>
  <div id="ver-list" class="scroll"></div>
</section>

<section id="sheet-ref" class="sheet" hidden>
  <div class="reft"><button id="ref-back" class="ib" aria-label="前の参照に戻る" hidden><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button><h2 id="ref-title"></h2></div>
  <div id="ref-body" class="scroll lawtext"></div>
  <div class="refbtns"><button id="ref-copy">コピー</button><button id="ref-go">この条へ移動</button></div>
</section>

<button id="update" hidden>新しい版があります。タップして更新</button>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
