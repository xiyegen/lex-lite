<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>簡易六法</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="簡易六法">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" id="tc" content="#fdfdfb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="top">
<header id="hd">
  <button id="back" class="ib" aria-label="法令一覧へ"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
  <div id="ttl"><span id="lawname">簡易六法</span><span id="old" hidden>旧版</span><span id="cur"></span></div>
  <button id="nav-back" class="ib" aria-label="前に見ていた条へ戻る" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button id="nav-fwd" class="ib" aria-label="戻る前の条へ進む" disabled><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <button id="btn-set" class="ib" aria-label="表示設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</header>
<div id="tabs" hidden></div>
</div>

<main id="home">
  <input id="filter" type="search" placeholder="法令名で絞り込み" autocomplete="off">
  <div id="lawlist"></div>
  <footer id="foot"></footer>
</main>

<main id="law" hidden><article id="body" class="lawtext"></article></main>

<div id="dock">
<nav id="bar" hidden>
  <button id="nav-toc"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".6"/><circle cx="4.5" cy="12" r=".6"/><circle cx="4.5" cy="18" r=".6"/></svg><span>目次</span></button>
  <button id="nav-jump"><svg viewBox="0 0 24 24"><path d="M9 4L7 20M17 4l-2 16M4 9h16M3.5 15h16"/></svg><span>条文へ移動</span></button>
  <button id="nav-find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>検索</span></button>
</nav>
</div>

<div id="scrim" hidden></div>

<section id="sheet-jump" class="sheet" hidden>
  <h2>条文へ移動</h2>
  <div id="jump-input"><span id="jump-val"></span><span id="jump-prev"></span></div>
  <div id="jump-hist"></div>
  <div id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="の" class="no">の</button><button data-k="0">0</button>
    <button id="pad-del" aria-label="1文字消す"><svg viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7zM12 9.5l5 5M17 9.5l-5 5"/></svg></button>
  </div>
  <button id="pad-go">移動</button>
</section>

<section id="sheet-toc" class="sheet tall" hidden>
  <h2>目次</h2>
  <div id="toc" class="scroll"></div>
</section>

<section id="sheet-find" class="sheet tall" hidden>
  <h2>この法令を検索</h2>
  <input id="find-q" type="search" placeholder="語句を入力" autocomplete="off" enterkeyhint="search">
  <div id="find-res" class="scroll"></div>
</section>

<section id="sheet-set" class="sheet" hidden>
  <h2>表示設定</h2>
  <div class="row"><span>外観</span>
    <span class="seg"><button data-theme-v="auto">自動</button><button data-theme-v="light">ライト</button><button data-theme-v="dark">ダーク</button></span></div>
  <div class="row"><span>文字サイズ</span>
    <span class="seg"><button id="fs-dn">小</button><b id="fs-val"></b><button id="fs-up">大</button></span></div>
  <div class="row"><span>書体</span>
    <span class="seg"><button data-font="gothic">ゴシック</button><button data-font="mincho">明朝</button></span></div>
  <div class="row"><span>括弧書きを薄くする</span>
    <span class="seg"><button data-dim="0">しない</button><button data-dim="1">する</button></span></div>
  <div class="row"><span>一覧に表示する法令</span>
    <span class="seg"><button id="pick-laws">選ぶ</button></span></div>
</section>

<section id="sheet-laws" class="sheet tall" hidden>
  <h2>一覧に表示する法令</h2>
  <div id="laws-pick" class="scroll"></div>
</section>

<section id="sheet-ver" class="sheet" hidden>
  <h2>版を選ぶ</h2>
  <div id="ver-list" class="scroll"></div>
</section>

<section id="sheet-ref" class="sheet" hidden>
  <div class="reft"><button id="ref-back" class="ib" aria-label="前の参照に戻る" hidden><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button><h2 id="ref-title"></h2></div>
  <div id="ref-body" class="scroll lawtext"></div>
  <div class="refbtns"><button id="ref-copy">コピー</button><button id="ref-go">この条へ移動</button></div>
</section>

<button id="update" hidden>新しい版があります。タップして更新</button>
<div id="toast" hidden></div>
<script src="version.js"></script>
<script src="app.js"></script>
</body>
</html>
